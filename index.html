<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .server-info {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 24px;
            margin: 5px 0;
        }

        .stat-card p {
            color: #666;
            font-size: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #764ba2;
        }

        .input-group button:active {
            transform: scale(0.98);
        }

        .todos-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: #f0f4ff;
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-right: 15px;
            accent-color: #667eea;
        }

        .todo-content {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .todo-description {
            font-size: 12px;
            color: #999;
            word-break: break-word;
        }

        .todo-text {
            display: flex;
            flex-direction: column;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .error {
            background: #ffe0e0;
            color: #c92a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c92a2a;
        }

        .success {
            background: #e0ffe0;
            color: #2a8a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2a8a2a;
            animation: slideIn 0.3s ease-out;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group button {
                width: 100%;
            }
        }

        .refresh-btn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 15px;
            width: 100%;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✓ Todo App</h1>
            <p style="color: #666; margin-bottom: 10px;">Manage your tasks efficiently</p>
            <div class="server-info" id="serverInfo">Connecting to server...</div>
        </div>

        <div id="message"></div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalTodos">0</h3>
                <p>Total Tasks</p>
            </div>
            <div class="stat-card">
                <h3 id="completedTodos">0</h3>
                <p>Completed</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingTodos">0</h3>
                <p>Pending</p>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="todoTitle" placeholder="Task title..." />
            <input type="text" id="todoDescription" placeholder="Description (optional)..." />
            <button onclick="addTodo()">Add Task</button>
        </div>

        <div id="todosContainer">
            <div class="loading">Loading tasks...</div>
        </div>

        <button class="refresh-btn" onclick="loadTodos()">🔄 Refresh</button>
    </div>

    <script>
        const API_BASE = '/';

        // Load todos on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTodos();
            loadStats();
            getServerInfo();
            // Refresh every 30 seconds
            setInterval(() => {
                loadTodos();
                loadStats();
            }, 30000);
        });

        async function getServerInfo() {
            try {
                const response = await fetch(API_BASE + 'health');
                const data = await response.json();
                document.getElementById('serverInfo').innerHTML = 
                    `Server: <strong>${data.server}</strong> | Database: <strong>${data.database}</strong>`;
            } catch (error) {
                document.getElementById('serverInfo').innerHTML = 'Unable to connect to server';
            }
        }

        async function loadTodos() {
            try {
                const response = await fetch(API_BASE + 'todos');
                const data = await response.json();
                const todos = data.todos || [];

                if (todos.length === 0) {
                    document.getElementById('todosContainer').innerHTML = `
                        <div class="empty-state">
                            <p>No tasks yet. Create one to get started! 🚀</p>
                        </div>
                    `;
                } else {
                    let html = '<div class="todos-list">';
                    todos.forEach(todo => {
                        const checkedAttr = todo.completed ? 'checked' : '';
                        const completedClass = todo.completed ? 'completed' : '';
                        html += `
                            <div class="todo-item ${completedClass}">
                                <input type="checkbox" class="todo-checkbox" ${checkedAttr} 
                                    onchange="toggleTodo(${todo.id}, this.checked)">
                                <div class="todo-content">
                                    <div class="todo-text">
                                        <span class="todo-title">${escapeHtml(todo.title)}</span>
                                        ${todo.description ? `<span class="todo-description">${escapeHtml(todo.description)}</span>` : ''}
                                    </div>
                                </div>
                                <div class="todo-actions">
                                    <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    document.getElementById('todosContainer').innerHTML = html;
                }
            } catch (error) {
                showMessage('Failed to load todos', 'error');
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(API_BASE + 'stats');
                const data = await response.json();
                document.getElementById('totalTodos').textContent = data.total_todos;
                document.getElementById('completedTodos').textContent = data.completed_todos;
                document.getElementById('pendingTodos').textContent = data.pending_todos;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function addTodo() {
            const title = document.getElementById('todoTitle').value.trim();
            const description = document.getElementById('todoDescription').value.trim();

            if (!title) {
                showMessage('Please enter a task title', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE + 'todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, description })
                });

                if (response.ok) {
                    document.getElementById('todoTitle').value = '';
                    document.getElementById('todoDescription').value = '';
                    showMessage('Task created successfully! ✓', 'success');
                    loadTodos();
                    loadStats();
                } else {
                    showMessage('Failed to create task', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function toggleTodo(id, completed) {
            try {
                const response = await fetch(API_BASE + `todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ completed })
                });

                if (response.ok) {
                    loadTodos();
                    loadStats();
                } else {
                    showMessage('Failed to update task', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }

            try {
                const response = await fetch(API_BASE + `todos/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Task deleted successfully! ✓', 'success');
                    loadTodos();
                    loadStats();
                } else {
                    showMessage('Failed to delete task', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
