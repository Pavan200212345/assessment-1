services:

  backend:
    build:
      context: ./app/backend
    container_name: employee-backend
    env_file:
      - ./app/backend/.env
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: employee-nginx
    ports:
      - "80:80"
    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend